{#- Pages shown inside the bilingual view (window.name "sumi-pane") are not counted. -#}
{%- set a = config.extra.analytics or {} -%}
{%- set ga = a.property if a.provider == 'google' else (config.google_analytics[0] if config.google_analytics else None) -%}
{%- if ga %}
<script>
  if (window.name !== 'sumi-pane') {
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date()); gtag('config', {{ ga | tojson }});
    var s = document.createElement('script'); s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent({{ ga | tojson }});
    document.head.appendChild(s);
  }
</script>
{%- endif %}
