[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-sumi"
description = "Sumi: a modern, local-first documentation theme for MkDocs."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Xianpeng Shen", email = "xianpeng.shen@gmail.com"}]
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: MkDocs",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "mkdocs-ng >=1.9",
    "Markdown >=3.6",
    "Pygments >=2.16",
]

[project.optional-dependencies]
test = ["pytest >=8"]

[project.urls]
Documentation = "https://mkdocs-ng.github.io/mkdocs-sumi/"
Source = "https://github.com/mkdocs-ng/mkdocs-sumi"
Issues = "https://github.com/mkdocs-ng/mkdocs-sumi/issues"
Changelog = "https://mkdocs-ng.github.io/mkdocs-sumi/releases/"

[project.entry-points."mkdocs.themes"]
sumi = "mkdocs_sumi.theme"

[project.entry-points."mkdocs.plugins"]
sumi = "mkdocs_sumi.plugin:SumiPlugin"

[project.entry-points."markdown.extensions"]
sumi = "mkdocs_sumi.markdown.extension:SumiExtension"

# The version comes from the Git tag, so a release is just publishing the
# draft release on GitHub.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_sumi"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "mkdocs.yml", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
