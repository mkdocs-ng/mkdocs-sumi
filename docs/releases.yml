- version: 0.1.2
  date: 2026-11-02
  summary: Landing page links to Markdown files now lead to the built pages.
  notes: |
    - A landing page `link: guide.md` in front matter now points at the page built from `guide.md`, not at its Markdown copy. Like a Markdown link, it is relative to the landing page and keeps its `#anchor`, and the build warns when the file doesn't exist.
