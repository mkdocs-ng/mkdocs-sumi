name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        mkdocs: [release, main]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - if: matrix.mkdocs == 'main'
        run: pip install "mkdocs-ng @ git+https://github.com/mkdocs-ng/mkdocs@main"
      - run: pytest tests --ignore=tests/test_browser.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[test]" playwright "mkdocs-ng @ git+https://github.com/mkdocs-ng/mkdocs@main"
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/test_browser.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # The docs use the llms_txt plugin, new in MkDocs-ng 1.9.
      - run: pip install -e . "mkdocs-ng @ git+https://github.com/mkdocs-ng/mkdocs@main"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: [test, browser, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
