name: Release

# Publishing a GitHub release (or pushing a tag) builds the package and
# uploads it to PyPI with trusted publishing, so no API token is stored.
# Then it rebuilds the docs, whose Releases page reads GitHub and PyPI.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - name: Check that the package version is the tag
        run: ls "dist/mkdocs_sumi-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mkdocs-sumi/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  docs:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Wait until PyPI lists the new version
        run: |
          for _ in $(seq 30); do
            curl -fsS -o /dev/null "https://pypi.org/pypi/mkdocs-sumi/${GITHUB_REF_NAME#v}/json" && exit 0
            sleep 10
          done
          echo "::warning::PyPI doesn't list ${GITHUB_REF_NAME} yet; the docs will show it on their next build."
      - name: Rebuild and deploy the docs
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
